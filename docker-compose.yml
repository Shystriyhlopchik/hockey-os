name: hockey-os
services:
  database:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:55440:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hockey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hockey_local_2026}
      POSTGRES_DB: ${POSTGRES_DB:-hockey_os}
    volumes:
      - hockey_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  hockey_postgres:
