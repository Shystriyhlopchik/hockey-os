<div class="section-heading">
  <div>
    @if (eyebrow()) {
      <span class="eyebrow">{{ eyebrow() }}</span>
    }
    <h2 [attr.id]="headingId() || null">{{ title() }}</h2>
  </div>
  <div class="heading-actions">
    <ng-content />
    @if (href()) {
      <a [routerLink]="href()">{{ linkLabel() }} <span aria-hidden="true">↗</span></a>
    }
  </div>
</div>
